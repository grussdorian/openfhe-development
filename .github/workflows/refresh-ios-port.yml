name: Refresh iOS port against upstream

# Forward-merges the iOS port commits onto each new upstream OpenFHE tag,
# builds for iOS device on a hosted macOS runner, and either opens a PR
# (success) or files an Issue (failure). Keeps the port at most one week
# behind upstream without manual intervention.
#
# Trigger:
#   - Weekly cron (Monday 06:00 UTC)
#   - Manual via the Actions tab (workflow_dispatch)
#
# Required secret:
#   GITHUB_TOKEN is provided automatically by GitHub Actions and has the
#   permissions configured below (contents:write, pull-requests:write,
#   issues:write). No additional secrets needed.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target_tag:
        description: "Optional upstream tag to forward-merge to (e.g. v1.5.2). Default: latest upstream tag."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  forward-merge:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      UPSTREAM_URL: https://github.com/openfheorg/openfhe-development.git
      FORK_PORT_BRANCH: ios-port

    steps:
      - name: Checkout fork (all history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use GITHUB_TOKEN so pushes back to the fork are authenticated.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "fheya-ios-port-bot"
          git config user.email "fheya-ios-port-bot@users.noreply.github.com"

      - name: Add upstream remote + fetch tags
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git fetch upstream --tags --quiet

      - name: Resolve target upstream tag
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target_tag }}" ]; then
            TAG="${{ github.event.inputs.target_tag }}"
          else
            # Latest semver-style tag from upstream
            TAG=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a target upstream tag"
            exit 1
          fi
          BRANCH="ios-port-$TAG"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved target: $TAG  (branch: $BRANCH)"

      - name: Skip if branch already exists on origin
        id: precheck
        run: |
          BRANCH="${{ steps.target.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Branch $BRANCH already exists on origin; nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute port commits (from ios-port branch)
        if: steps.precheck.outputs.skip == 'false'
        id: portcommits
        run: |
          git fetch origin "$FORK_PORT_BRANCH" --quiet
          git fetch upstream main --quiet
          # Port commits = commits on origin/ios-port that
          #   (a) are NOT reachable from upstream/main, and
          #   (b) touch port-related paths (openfhe_ios/, .gitignore, CMakeLists.txt).
          # Anchoring against upstream/main (not origin/main) avoids the trap
          # where the fork's main already has the port merged in — that would
          # make merge-base swallow the port commits.
          COMMITS=$(git rev-list --reverse "origin/$FORK_PORT_BRANCH" ^upstream/main -- \
                      openfhe_ios .gitignore CMakeLists.txt)
          if [ -z "$COMMITS" ]; then
            echo "::error::No port commits found on origin/$FORK_PORT_BRANCH ahead of upstream/main"
            exit 1
          fi
          echo "Will replay commits:"
          echo "$COMMITS"
          # Save newline-separated to env via temp file for later step.
          printf '%s\n' "$COMMITS" > /tmp/port_commits.txt

      - name: Create forward-merge branch + cherry-pick
        if: steps.precheck.outputs.skip == 'false'
        id: cherrypick
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          BRANCH="${{ steps.target.outputs.branch }}"

          git checkout -b "$BRANCH" "refs/tags/$TAG"
          STATUS=0
          while IFS= read -r SHA; do
            if ! git cherry-pick "$SHA"; then
              echo "::error::Cherry-pick failed at $SHA"
              git cherry-pick --abort || true
              STATUS=1
              break
            fi
          done < /tmp/port_commits.txt
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit $STATUS

      - name: Pre-flight build tools
        if: steps.precheck.outputs.skip == 'false' && steps.cherrypick.outputs.status == '0'
        run: |
          brew install cmake || brew upgrade cmake || true
          cmake --version
          xcodebuild -version

      - name: Build iOS device static lib
        if: steps.precheck.outputs.skip == 'false' && steps.cherrypick.outputs.status == '0'
        id: build
        run: |
          cd openfhe_ios
          bash build_ios.sh device 2>&1 | tee /tmp/ios-build.log

      - name: Push forward-merged branch
        if: steps.precheck.outputs.skip == 'false' && steps.cherrypick.outputs.status == '0'
        run: |
          BRANCH="${{ steps.target.outputs.branch }}"
          git push -u origin "$BRANCH"

      - name: Write success summary + PR link
        if: steps.precheck.outputs.skip == 'false' && steps.cherrypick.outputs.status == '0'
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          BRANCH="${{ steps.target.outputs.branch }}"
          REPO="${{ github.repository }}"
          PR_URL="https://github.com/$REPO/compare/ios-port...$BRANCH?expand=1"
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ✅ iOS port refreshed to OpenFHE \`$TAG\`

          - Cherry-picked the iOS-port commits onto upstream \`$TAG\`.
          - Built \`libopenfhe_ios.a\` + OpenFHE statics for iOS device on \`macos-latest\`.
          - Pushed branch \`$BRANCH\` to fork.

          **Next step — open the PR (one click)**: [$BRANCH → ios-port]($PR_URL)
          EOF

      - name: Write failure summary
        if: failure() && steps.precheck.outputs.skip == 'false'
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          BUILDLOG="(no build log produced — failure happened before build)"
          if [ -f /tmp/ios-build.log ]; then
            BUILDLOG=$(tail -120 /tmp/ios-build.log)
          fi
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ❌ iOS port refresh failed for OpenFHE \`$TAG\`

          Likely cause: cherry-pick conflict against upstream API drift, or the
          iOS C bridge no longer compiles against the new OpenFHE release.

          Re-run via the Actions tab → "Refresh iOS port against upstream"
          → Run workflow → set \`target_tag=$TAG\`.

          ### Tail of build log
          \`\`\`
          $BUILDLOG
          \`\`\`
          EOF
